<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Feature | CabFlow</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/admin/manage-records.css">
  <style>
    .feature-grid { display: grid; gap: 18px; }
    .feature-panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; }
    .feature-panel h2 { margin: 0 0 8px; font-size: 1.15rem; }
    .feature-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
    .feature-form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .feature-form label { display: grid; gap: 4px; font-size: 0.9rem; color: #4b5563; }
    .feature-form input, .feature-form select, .feature-form textarea, .feature-toolbar select {
      width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px;
    }
    .feature-message { color: #b91c1c; min-height: 1.2em; }
    .records-table td, .records-table th { font-size: 0.92rem; }
    .inline-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="main-content placeholder-main">
    <a class="back-link" href="/admin/admin-dashboard.html">← Back to dashboard</a>
    <header class="topbar" style="margin-top:25px">
      <div>
        <p class="eyebrow">ADMIN WORKSPACE</p>
        <h1 id="featureTitle">Feature page</h1>
        <p class="subheading" id="featureDescription">Loading feature tools…</p>
      </div>
    </header>
    <p class="feature-message" id="featureMessage"></p>
    <div class="feature-grid" id="featureContent"></div>
  </main>
  <script>
    const API = '/api/admin';
    const params = new URLSearchParams(location.search);
    const feature = params.get('feature') || '';
    const titleElement = document.getElementById('featureTitle');
    const descriptionElement = document.getElementById('featureDescription');
    const messageElement = document.getElementById('featureMessage');
    const contentElement = document.getElementById('featureContent');

    function safe(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function formatFare(value) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency', currency: 'INR', maximumFractionDigits: 0
      }).format(Number(value || 0));
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        credentials: 'same-origin',
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
      return data;
    }

    function setHeading(title, description) {
      titleElement.textContent = title;
      descriptionElement.textContent = description;
      document.title = `${title} | CabFlow Admin`;
    }

    async function renderTrips() {
      setHeading('Start / complete trip', 'Create assigned trips and complete ongoing rides.');
      const [ongoing, options] = await Promise.all([
        request(`${API}/ongoing-trips`),
        request(`${API}/trip-form-options`)
      ]);

      const passengerOptions = options.passengers.map(p =>
        `<option value="${safe(p.passenger_id)}">${safe(p.name)} (${safe(p.email)})</option>`
      ).join('');

      const driverVehicleOptions = options.drivers
        .filter(d => d.vehicle_id)
        .map(d =>
          `<option value="${safe(d.driver_id)}:${safe(d.vehicle_id)}">${safe(d.name)} · ${safe(d.vehicle_number)} (${safe(d.vehicle_type)})</option>`
        ).join('');

      contentElement.innerHTML = `
        <section class="feature-panel">
          <h2>Create trip</h2>
          <form class="feature-form" id="createTripForm">
            <label>Passenger<select name="passenger_id" required>${passengerOptions}</select></label>
            <label>Driver / vehicle<select name="driver_vehicle" required>${driverVehicleOptions || '<option value="">No available vehicles</option>'}</select></label>
            <label>Pickup<input name="pickup_location" required maxlength="255"></label>
            <label>Destination<input name="destination" required maxlength="255"></label>
            <label>Estimated fare<input name="estimated_fare" type="number" min="0" step="0.01" required></label>
            <label>Distance (km)<input name="distance_km" type="number" min="0" step="0.01"></label>
            <div><button class="records-button" type="submit">Create assigned trip</button></div>
          </form>
        </section>
        <section class="feature-panel">
          <h2>Ongoing trips</h2>
          <div class="records-table-wrapper">
            <table class="records-table">
              <thead>
                <tr>
                  <th>Trip</th><th>Passenger</th><th>Driver</th><th>Route</th><th>Fare</th><th>Status</th><th></th>
                </tr>
              </thead>
              <tbody>
                ${ongoing.length ? ongoing.map(trip => `
                  <tr>
                    <td>#${safe(trip.trip_id)}</td>
                    <td>${safe(trip.passenger_name)}</td>
                    <td>${safe(trip.driver_name)}<br><small>${safe(trip.vehicle_number)}</small></td>
                    <td>${safe(trip.pickup_location)} → ${safe(trip.destination)}</td>
                    <td>${safe(formatFare(trip.fare))}</td>
                    <td>${safe(String(trip.status).replaceAll('_', ' '))}</td>
                    <td>
                      ${trip.status === 'ASSIGNED' || trip.status === 'IN_PROGRESS'
                        ? `<button class="records-button" data-complete="${safe(trip.trip_id)}">Complete</button>`
                        : '—'}
                    </td>
                  </tr>
                `).join('') : '<tr><td colspan="7" class="records-empty">No ongoing trips.</td></tr>'}
              </tbody>
            </table>
          </div>
        </section>
      `;

      document.getElementById('createTripForm').addEventListener('submit', async event => {
        event.preventDefault();
        const form = new FormData(event.target);
        const [driverId, vehicleId] = String(form.get('driver_vehicle') || '').split(':');
        try {
          await request(`${API}/trips`, {
            method: 'POST',
            body: JSON.stringify({
              passenger_id: Number(form.get('passenger_id')),
              driver_id: Number(driverId),
              vehicle_id: Number(vehicleId),
              pickup_location: form.get('pickup_location'),
              destination: form.get('destination'),
              estimated_fare: Number(form.get('estimated_fare')),
              distance_km: form.get('distance_km') || null
            })
          });
          await renderTrips();
        } catch (error) {
          messageElement.textContent = error.message;
        }
      });

      contentElement.onclick = async event => {
        const tripId = event.target.closest('[data-complete]')?.dataset.complete;
        if (!tripId) return;
        try {
          await request(`${API}/trips/${tripId}/complete`, { method: 'PUT' });
          await renderTrips();
        } catch (error) {
          messageElement.textContent = error.message;
        }
      };
    }

    async function renderFaresAreas() {
      setHeading('Manage fares and service areas', 'Update pricing rules and active service areas.');
      const [fares, areas] = await Promise.all([
        request(`${API}/fare-rules`),
        request(`${API}/service-areas`)
      ]);

      contentElement.innerHTML = `
        <section class="feature-panel">
          <h2>Fare rules</h2>
          <div class="records-table-wrapper">
            <table class="records-table">
              <thead>
                <tr>
                  <th>Type</th><th>Base</th><th>Per km</th><th>Per min</th><th>Cancel fee</th><th>Status</th><th></th>
                </tr>
              </thead>
              <tbody>
                ${fares.map(fare => `
                  <tr data-fare-id="${safe(fare.fare_id)}">
                    <td><input name="vehicle_type" value="${safe(fare.vehicle_type)}"></td>
                    <td><input name="base_fare" type="number" step="0.01" value="${safe(fare.base_fare)}"></td>
                    <td><input name="per_km_rate" type="number" step="0.01" value="${safe(fare.per_km_rate)}"></td>
                    <td><input name="per_minute_rate" type="number" step="0.01" value="${safe(fare.per_minute_rate)}"></td>
                    <td><input name="cancellation_fee" type="number" step="0.01" value="${safe(fare.cancellation_fee)}"></td>
                    <td>
                      <select name="status">
                        <option value="ACTIVE" ${fare.status === 'ACTIVE' ? 'selected' : ''}>ACTIVE</option>
                        <option value="INACTIVE" ${fare.status === 'INACTIVE' ? 'selected' : ''}>INACTIVE</option>
                      </select>
                    </td>
                    <td><button class="records-button" data-save-fare="${safe(fare.fare_id)}">Save</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>
        <section class="feature-panel">
          <h2>Service areas</h2>
          <form class="feature-form" id="areaForm">
            <label>Area name<input name="area_name" required></label>
            <label>City<input name="city" required></label>
            <label>State<input name="state" required></label>
            <label>Status
              <select name="status">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
              </select>
            </label>
            <div><button class="records-button" type="submit">Add area</button></div>
          </form>
          <div class="records-table-wrapper" style="margin-top:16px">
            <table class="records-table">
              <thead><tr><th>Area</th><th>City</th><th>State</th><th>Status</th><th></th></tr></thead>
              <tbody>
                ${areas.map(area => `
                  <tr>
                    <td>${safe(area.area_name)}</td>
                    <td>${safe(area.city)}</td>
                    <td>${safe(area.state)}</td>
                    <td>${safe(area.status)}</td>
                    <td class="inline-actions">
                      <button class="records-button secondary" data-toggle-area="${safe(area.area_id)}" data-status="${safe(area.status)}" data-name="${safe(area.area_name)}" data-city="${safe(area.city)}" data-state="${safe(area.state)}">
                        ${area.status === 'ACTIVE' ? 'Deactivate' : 'Activate'}
                      </button>
                      <button class="records-button danger" data-delete-area="${safe(area.area_id)}">Delete</button>
                    </td>
                  </tr>
                `).join('') || '<tr><td colspan="5" class="records-empty">No service areas.</td></tr>'}
              </tbody>
            </table>
          </div>
        </section>
      `;

      contentElement.onclick = async event => {
        const fareId = event.target.closest('[data-save-fare]')?.dataset.saveFare;
        const toggle = event.target.closest('[data-toggle-area]');
        const deleteId = event.target.closest('[data-delete-area]')?.dataset.deleteArea;

        try {
          if (fareId) {
            const row = event.target.closest('tr');
            await request(`${API}/fare-rules/${fareId}`, {
              method: 'PUT',
              body: JSON.stringify({
                vehicle_type: row.querySelector('[name="vehicle_type"]').value,
                base_fare: Number(row.querySelector('[name="base_fare"]').value),
                per_km_rate: Number(row.querySelector('[name="per_km_rate"]').value),
                per_minute_rate: Number(row.querySelector('[name="per_minute_rate"]').value),
                cancellation_fee: Number(row.querySelector('[name="cancellation_fee"]').value),
                status: row.querySelector('[name="status"]').value
              })
            });
            messageElement.textContent = 'Fare rule saved.';
          }

          if (toggle) {
            await request(`${API}/service-areas/${toggle.dataset.toggleArea}`, {
              method: 'PUT',
              body: JSON.stringify({
                area_name: toggle.dataset.name,
                city: toggle.dataset.city,
                state: toggle.dataset.state,
                status: toggle.dataset.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'
              })
            });
            await renderFaresAreas();
          }

          if (deleteId) {
            await request(`${API}/service-areas/${deleteId}`, { method: 'DELETE' });
            await renderFaresAreas();
          }
        } catch (error) {
          messageElement.textContent = error.message;
        }
      };

      document.getElementById('areaForm').onsubmit = async event => {
        event.preventDefault();
        const form = Object.fromEntries(new FormData(event.target).entries());
        try {
          await request(`${API}/service-areas`, { method: 'POST', body: JSON.stringify(form) });
          await renderFaresAreas();
        } catch (error) {
          messageElement.textContent = error.message;
        }
      };
    }

    async function renderReports() {
      setHeading('View reports', 'Revenue, trips, drivers, and passenger growth.');
      contentElement.innerHTML = `
        <section class="feature-panel">
          <div class="feature-toolbar">
            <label>Period
              <select id="reportDays">
                <option value="7">Last 7 days</option>
                <option value="30" selected>Last 30 days</option>
              </select>
            </label>
            <button class="records-button" id="loadReportsBtn" type="button">Refresh</button>
          </div>
          <div id="reportPanels" class="feature-grid"></div>
        </section>
      `;

      async function load() {
        const days = document.getElementById('reportDays').value;
        const [revenue, trips, drivers, passengers] = await Promise.all([
          request(`${API}/reports/revenue?days=${days}`),
          request(`${API}/reports/trips?days=${days}`),
          request(`${API}/reports/drivers?days=${days}`),
          request(`${API}/reports/passengers?days=${days}`)
        ]);

        document.getElementById('reportPanels').innerHTML = `
          <section class="feature-panel">
            <h2>Daily revenue</h2>
            <table class="records-table"><thead><tr><th>Date</th><th>Revenue</th></tr></thead>
            <tbody>${revenue.length ? revenue.map(r => `<tr><td>${safe(r.report_date)}</td><td>${safe(formatFare(r.total_revenue))}</td></tr>`).join('') : '<tr><td colspan="2" class="records-empty">No data.</td></tr>'}</tbody></table>
          </section>
          <section class="feature-panel">
            <h2>Daily trips</h2>
            <table class="records-table"><thead><tr><th>Date</th><th>Trips</th></tr></thead>
            <tbody>${trips.length ? trips.map(r => `<tr><td>${safe(r.report_date)}</td><td>${safe(r.total_trips)}</td></tr>`).join('') : '<tr><td colspan="2" class="records-empty">No data.</td></tr>'}</tbody></table>
          </section>
          <section class="feature-panel">
            <h2>Top drivers</h2>
            <table class="records-table"><thead><tr><th>Driver</th><th>Completed</th></tr></thead>
            <tbody>${drivers.length ? drivers.map(r => `<tr><td>${safe(r.driver_name)}</td><td>${safe(r.completed_trips)}</td></tr>`).join('') : '<tr><td colspan="2" class="records-empty">No data.</td></tr>'}</tbody></table>
          </section>
          <section class="feature-panel">
            <h2>New passengers</h2>
            <table class="records-table"><thead><tr><th>Date</th><th>Registrations</th></tr></thead>
            <tbody>${passengers.length ? passengers.map(r => `<tr><td>${safe(r.report_date)}</td><td>${safe(r.new_passengers)}</td></tr>`).join('') : '<tr><td colspan="2" class="records-empty">No data.</td></tr>'}</tbody></table>
          </section>
        `;
      }

      document.getElementById('loadReportsBtn').addEventListener('click', () => {
        load().catch(error => { messageElement.textContent = error.message; });
      });
      await load();
    }

    async function renderAvailableRides() {
      setHeading('Search and view available rides', 'Live bookings from the trips table.');
      const bookings = await request(`${API}/bookings`);
      contentElement.innerHTML = `
        <section class="feature-panel">
          <div class="feature-toolbar">
            <input id="rideSearch" type="search" placeholder="Search rides...">
          </div>
          <div class="records-table-wrapper">
            <table class="records-table">
              <thead>
                <tr><th>Trip</th><th>Passenger</th><th>Driver</th><th>Route</th><th>Fare</th><th>Status</th></tr>
              </thead>
              <tbody id="rideRows"></tbody>
            </table>
          </div>
        </section>
      `;

      function render(query = '') {
        const filtered = bookings.filter(b =>
          [b.trip_id, b.passenger_name, b.driver_name, b.pickup_location, b.destination, b.status]
            .join(' ').toLowerCase().includes(query.toLowerCase())
        );
        document.getElementById('rideRows').innerHTML = filtered.length ? filtered.map(b => `
          <tr>
            <td>#${safe(b.trip_id)}</td>
            <td>${safe(b.passenger_name)}</td>
            <td>${safe(b.driver_name)}</td>
            <td>${safe(b.pickup_location)} → ${safe(b.destination)}</td>
            <td>${safe(formatFare(b.fare))}</td>
            <td>${safe(String(b.status).replaceAll('_', ' '))}</td>
          </tr>
        `).join('') : '<tr><td colspan="6" class="records-empty">No rides found.</td></tr>';
      }

      document.getElementById('rideSearch').addEventListener('input', event => render(event.target.value));
      render();
    }

    async function renderProfile() {
      setHeading('Manage own profile', 'Your signed-in administrator account.');
      const session = await request('/api/auth/session');
      if (!session.authenticated || !['ADMIN', 'SUPER ADMIN'].includes(session.role)) {
        location.replace('/auth.html?role=ADMIN');
        return;
      }

      contentElement.innerHTML = `
        <section class="feature-panel">
          <h2>${safe(session.user.name)}</h2>
          <p>Email: ${safe(session.user.email)}</p>
          <p>Role: ${safe(session.role)}</p>
          <p>User ID: ${safe(session.user.user_id)}</p>
          <p class="subheading">Admin profile fields beyond name/email/role are not stored separately in this schema.</p>
        </section>
      `;
    }

    async function boot() {
      try {
        if (feature === 'Start/complete trip') await renderTrips();
        else if (feature === 'Manage fares and service areas') await renderFaresAreas();
        else if (feature === 'View reports') await renderReports();
        else if (feature === 'Search and view available rides') await renderAvailableRides();
        else if (feature === 'Manage own profile') await renderProfile();
        else {
          setHeading(feature || 'Admin feature', 'This feature page is not configured yet.');
          contentElement.innerHTML = '<section class="feature-panel"><p>Use the dashboard navigation to open a supported admin tool.</p></section>';
        }
      } catch (error) {
        messageElement.textContent = error.message;
      }
    }

    boot();
  </script>
</body>
</html>
